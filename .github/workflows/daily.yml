name: 每日积分任务

on:
  schedule:
    # 北京时间 08:00
    - cron: "0 0 * * *"
    # 北京时间 12:00 补跑（幂等，重复跑不重复计分）
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  daily:
    # 2026-10-19 起 ubuntu-latest 已迁到 Ubuntu 26.04，固定回验证过的 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pycryptodome requests

      # 只保留签到 + 分享，去掉 B站 素材下载 / 混剪 / 搬运发视频
      # （GitHub 美国 IP 访问 B站 playurl 接口必被 412 风控，且 ffmpeg 在 26.04 上不稳）
      - name: Run sign-in and share
        env:
          CHERY_TOKEN: ${{ secrets.CHERY_TOKEN }}
        run: python src/daily.py --quick-only
